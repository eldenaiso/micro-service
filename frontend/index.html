<!DOCTYPE html>
<html lang="en"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF File Manager</title> <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>File Manager</h1> </header>

    <main>
        <section class="card">
            <h2>Upload a New PDF</h2> <form id="uploadForm">
                <input type="file" id="fileInput" accept="application/pdf" required>
                <button type="submit">Upload File</button> </form>
            <p id="uploadStatus"></p>
        </section>

        <section class="card">
            <h2>Files on Server</h2> <button id="refreshButton">Refresh List</button> <ul id="fileList">
                </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
